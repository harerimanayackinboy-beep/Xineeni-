<!DOCTYPE html>
<html lang="rn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xineeni</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#667085;--ln:#e4e7ec;--ac:#0f766e;--ok:#16a34a;--wa:#d97706;--er:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1319;--card:#1a2029;--tx:#eef1f5;--mut:#98a2b3;--ln:#2a323e;--ac:#2dd4bf}}
:root[data-theme="dark"]{--bg:#0f1319;--card:#1a2029;--tx:#eef1f5;--mut:#98a2b3;--ln:#2a323e;--ac:#2dd4bf}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{margin:4px 0 2px;font-size:26px;color:var(--ac)}
.sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lbl{font-weight:600}.val{font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--ln);border-radius:99px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .4s}
.note{color:var(--mut);font-size:13px;margin-top:6px}
.alert{border-left:4px solid var(--er);background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--ln);border-left:4px solid var(--er)}
.ok{border-left-color:var(--ok)}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:600}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--ln)}
.btn:disabled{opacity:.5}
textarea{width:100%;min-height:80px;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;resize:vertical}
.msg{padding:10px 12px;border-radius:12px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.me{background:var(--ac);color:#fff;margin-left:30px}
.ai{background:var(--card);border:1px solid var(--ln);margin-right:14px}
.hide{display:none}.msg b{font-weight:700}
</style>
</head>
<body>
<main>
<h1>Xineeni</h1>
<p class="sub">Umuganga wa telefone yawe</p>
<div class="tabs">
  <button id="t1" class="on">Ubuzima</button>
  <button id="t2">Baza AI</button>
</div>

<section id="p1">
  <div id="alerts"></div>
  <div class="card"><div class="row"><span class="lbl">🔋 Batiri</span><span class="val" id="bat">…</span></div><div class="bar"><i id="batb"></i></div><div class="note" id="batn"></div></div>
  <div class="card"><div class="row"><span class="lbl">⚙️ Processor</span><span class="val" id="cpu">…</span></div></div>
  <div class="card"><div class="row"><span class="lbl">🧠 Memoire (RAM)</span><span class="val" id="ram">…</span></div></div>
  <div class="card"><div class="row"><span class="lbl">📶 Murandasi</span><span class="val" id="net">…</span></div><div class="note" id="netn"></div></div>
  <button class="btn" id="notifBtn">Emera notifications</button>
  <p class="note"><span id="upd"></span><br>Igenzura buri masegonda 5 igihe iri rakinguye. Ububiko bwa telefone ntibusomwa na web app; AI izobubaza.</p>
</section>

<section id="p2" class="hide">
  <div class="card">
    <div class="lbl" style="margin-bottom:8px">Sobanura ikibazo c’telefone yawe</div>
    <textarea id="q" placeholder="Urugero: telefone yanje iratinda kandi irashyuha"></textarea>
    <button class="btn" id="ask" style="margin-top:8px">Rungika</button><button class="btn sec" id="clr" style="margin-top:8px">Tangura ikiganiro gishasha</button>
  </div>
  <div id="chat"></div>
  <p class="note" id="aiNote"></p>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const S={bat:null,charging:null,temp:null,sto:null,ram:navigator.deviceMemory||null,net:null};
let notified={};

// Tabs
function tab(n){$('p1').classList.toggle('hide',n!==1);$('p2').classList.toggle('hide',n!==2);$('t1').classList.toggle('on',n===1);$('t2').classList.toggle('on',n===2)}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);

function color(el,pct,invert){el.style.background=(invert?pct>90:pct<15)?'var(--er)':(invert?pct>75:pct<30)?'var(--wa)':'var(--ok)'}

async function readAll(){
  try{
    if(navigator.getBattery){
      const b=await navigator.getBattery();
      S.bat=Math.round(b.level*100);S.charging=b.charging;
      $('bat').textContent=S.bat+'%'+(b.charging?' ⚡':'');
      $('batb').style.width=S.bat+'%';color($('batb'),S.bat,false);
      $('batn').textContent=b.charging?'Irimo kuzura':'Ntirimo kuzura';
    }else{$('bat').textContent='Ntiboneka';$('batn').textContent='Browser yawe ntishobora gusoma batiri'}
  }catch(e){$('bat').textContent='Ntiboneka'}
  S.cpu=navigator.hardwareConcurrency||null;
  $('cpu').textContent=S.cpu?S.cpu+' cores':'Ntiboneka';
  $('ram').textContent=S.ram?('~'+S.ram+' GB'):'Ntiboneka';
  const c=navigator.connection;
  S.net=navigator.onLine?(c&&c.effectiveType?c.effectiveType.toUpperCase():'Iriho'):'Nta murandasi';
  $('net').textContent=S.net;
  $('netn').textContent=(c&&c.downlink)?('Umuvuduko ~'+c.downlink+' Mbps · ping '+(c.rtt||'?')+' ms'):'';
  $('upd').textContent='Igenzuwe: '+new Date().toLocaleTimeString();
  check();
}

function problems(){
  const p=[];
  if(S.bat!==null&&S.bat<=15&&!S.charging)p.push({k:'bat',t:'Batiri iri hasi ('+S.bat+'%). Yizuze vuba.'});
  if(!navigator.onLine)p.push({k:'net',t:'Nta murandasi ihari.'});
  if(S.ram&&S.ram<=2)p.push({k:'ram',t:'Memoire ya telefone ni nke ('+S.ram+' GB). Ifunge apps udakoresha.'});
  return p;
}

async function ping(text){
  try{
    if('Notification' in window&&Notification.permission==='granted'){
      const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
      if(reg)reg.showNotification('Xineeni',{body:text});else new Notification('Xineeni',{body:text});
    }
  }catch(e){}
}

function check(){
  const p=problems(),box=$('alerts');box.innerHTML='';
  if(!p.length){const d=document.createElement('div');d.className='alert ok';d.textContent='✅ Telefone yawe imeze neza.';box.appendChild(d);}
  p.forEach(x=>{
    const d=document.createElement('div');d.className='alert';d.textContent='⚠️ '+x.t;box.appendChild(d);
    if(!notified[x.k]){notified[x.k]=1;ping(x.t)}
  });
  Object.keys(notified).forEach(k=>{if(!p.some(x=>x.k===k))delete notified[k]});
}

$('notifBtn').onclick=async()=>{
  try{
    if(!('Notification' in window)){$('notifBtn').textContent='Ntibishoboka kuri iyi browser';return}
    const r=await Notification.requestPermission();
    $('notifBtn').textContent=r==='granted'?'Notifications zirakora ✅':'Notifications zirahagaritswe';
  }catch(e){$('notifBtn').textContent='Ntibishoboka hano'}
};

// AI
const hist=[];
function fmt(el,t){el.innerHTML='';t.split('\n').forEach((ln,i,a)=>{ln.split(/(\*\*[^*]+\*\*)/).forEach(p=>{if(/^\*\*[^*]+\*\*$/.test(p)){const b=document.createElement('b');b.textContent=p.slice(2,-2);el.appendChild(b)}else el.appendChild(document.createTextNode(p))});if(i<a.length-1)el.appendChild(document.createElement('br'))})}
function addMsg(cls,t){const d=document.createElement('div');d.className='msg '+cls;fmt(d,t);$('chat').appendChild(d);d.scrollIntoView({block:'nearest'});return d}
$('clr').onclick=()=>{hist.length=0;$('chat').innerHTML=''};
let sample=null;
(async()=>{try{sample=await claude.use('sample')}catch(e){}
  if(!sample){$('ask').disabled=true;$('aiNote').textContent='AI ntiboneka hano. Fungura iyi page muri claude.ai.'}})();

$('ask').onclick=async()=>{
  const q=$('q').value.trim();if(!q||!sample)return;
  addMsg('me',q);$('q').value='';
  hist.push({role:'user',content:q});
  const out=addMsg('ai','Irasuzuma…');$('ask').disabled=true;
  const sys='Uri Xineeni, umuganga wa telefone. Vuga Ikirundi coroshe, mu magambo make. Ni ikiganiro: ibuka ivyo mwavuze. Koresha igikoresho get_phone_status ubone amakuru nyakuri ya telefone (batiri, RAM, murandasi) mbere yo gusuzuma. Ntukoreshe ** canke markdown. Vuga ikibazo gishoboka cane n’intambwe zoroshe zo gukemura. Niba ata makuru ahagije (urugero ububiko), babaza ikibazo kimwe gusa.';
  const m=hist.slice(-12);
  const msgs=m.map((h,i)=>i===0?{role:h.role,content:sys+'\n\nUmukoresha: '+h.content}:h);
  const tools=[{name:'get_phone_status',description:'Soma amakuru nyakuri ya telefone ubu',inputSchema:{type:'object',properties:{}},execute:async()=>{await readAll();const c=navigator.connection||{};return JSON.stringify({batiri_pct:S.bat,irimo_kuzura:S.charging,RAM_GB:S.ram,cores:S.cpu,murandasi:S.net,Mbps:c.downlink,ping_ms:c.rtt})}}];
  try{
    const r=await sample(msgs,{cache:false,tools,onText:({text})=>{fmt(out,text)}});
    fmt(out,r.text);hist.push({role:'assistant',content:r.text});
  }catch(e){hist.pop();fmt(out,(e&&e.code==='not_granted')?'Ukeneye kwemera AI gukora.':'Habaye ikosa. Ongera ugerageze.')}
  $('ask').disabled=false;
};

readAll();setInterval(readAll,5000);
if(navigator.getBattery)navigator.getBattery().then(b=>{['levelchange','chargingchange'].forEach(ev=>b.addEventListener(ev,readAll))}).catch(()=>{});
addEventListener('online',readAll);addEventListener('offline',readAll);
</script>
</body>
</html>
